<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>superBingo</title>
    <link href="/fronted/publico/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="./Multimedia/img/logoSuperBingo-remejorado.png">
    <link rel="stylesheet" href="./Estilos/crearSala.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <b>CREAR SALA</b>
        </div>
        <form>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="roomName">
                            <b>Nombre</b>
                        </label>
                        <input class="form-control" id="roomName" readonly="" type="text"
                            value="Sala de pepitojuan08"/>
                    </div>
                    <div class="form-group">
                        <label for="roomId"><b>ID de Sala: </b><span id="roomId"></span></label>
                    </div>
                    <div class="form-group">
                        <label for="password">
                            <b>Contraseña</b>
                        </label>
                        <input class="form-control" id="password" placeholder="Contraseña de la sala."
                            type="password" />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="maxPlayers">
                            <b>Número de jugadores</b>
                        </label>
                        <select class="form-control" id="maxPlayers">
                            <option>
                                Máximo de jugadores
                            </option>
                            <option>
                                1
                            </option>
                            <option>
                                2
                            </option>
                            <option>
                                3
                            </option>
                            <option>
                                4
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="maxCards">
                            <b>Número de cartones</b>
                        </label>
                        <select class="form-control" id="maxCards">
                            <option>
                                Máximo de cartones
                            </option>
                            <option>
                                1
                            </option>
                            <option>
                                2
                            </option>
                            <option>
                                3
                            </option>
                            <option>
                                4
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>
                            <b>Tipo de sala</b>
                            <form id="roomForm">
                                <label>
                                    <input type="radio" name="roomType" value="public" id="public"> Sala Pública
                                </label>
                                <label>
                                    <input type="radio" name="roomType" value="private" id="private"> Sala Privada
                                </label>
                            </form>

                    </div>
                </div>
            </div>
            <div class="container2">
                <a href="./salas.html"><button class="comic-button" type="button">Cancelar</button></a>
                <button class="btn-create">Crear</button>
            </div>
    </div>
    </form>
    </div>

    <script src="./escripts/crearSalas.js"></script>
</body>

</html>
