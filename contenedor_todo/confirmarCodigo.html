<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - SuperBingo</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Estilos/login.css">
</head>
<body>
    <div class="content">
        <div class="login-container">
            <h2>Verificar Código</h2>
            <form id="verification-form">
                <label for="codigo">Ingresa el código de verificación</label>
                <input type="text" id="codigo" name="codigo" placeholder="Código de verificación" required>
                <input type="submit" value="Verificar">
            </form>
        </div>
    </div>

    <script src="verificacion.js"></script>
</body>
</html>
