<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>superBingo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Estilos/loginRegistro.css">
    <link rel="icon" type="image/png" href="./Multimedia/img/logoSuperBingo-remejorado.png">
</head>
<body>

    <!-- fondo de video -->
    <video autoplay muted loop id="background-video">
        <source src="./Multimedia/img/fondo login.mp4" type="video/mp4">
    </video>
    
    <!-- conteiner login -->
    
    
        <div class="login-container">
            
            <form id="registro-form" method="POST">
                <img src="./Multimedia/img/logoSuperBingo-remejorado.png" alt="logo" class="logo" id="Gamelogo">

                    <!-- Campo de Nombre de usuario -->

                    <input type="text" id="usuario" name="usuario" spellcheck="false" required class="login-container">
                    <label class="login-container">Usuario</label>
            
                    <!-- Campo de correo -->

                    <input type="email" id="email" name="email" spellcheck="false" required autocomplete="username" class="login-container">
                    <label class="login-container">Email</label>
                    
            
                    <!-- Campo de contraseña -->
                    
                    <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required class="login-container">
                    <label class="login-container">Contraseña</label>
                    
            
                    <!-- Campo de confirmación de contraseña -->
                    
                    <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" autocomplete="new-password" required class="login-container">
                    <label class="login-container">Confirmar Contraseña</label>
                    
            
                    
                    <div id="mensaje-formato"></div>
                    <div id="mensaje-correoOusuario"></div>
                    <div id="mensaje-error" style="color: red;"></div> <!-- Mensaje de error si no coinciden -->
                    <button class="login-button" id="registrar-button" type="submit">Registrarse</button>
            </form>
            
            
        </div>
    

    <script src="escripts/registro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
